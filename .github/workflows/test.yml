name: Test & Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  test-linux:
    name: Unit Tests (Linux Python 3.12)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install System Dependencies & FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libxcb-cursor0 libegl1 libgl1 libxkbcommon-x11-0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Run Core Test Suite with Pytest
      run: |
        python -m pytest tests/test_cloud_item_cache.py tests/test_pack_manager.py tests/test_tab_assets_packs_and_collections.py tests/test_asset_hub_e2e.py tests/test_lux_effects.py tests/test_floating_bubble.py tests/test_auto_update_system.py tests/test_installed_badge_and_storage.py tests/test_studio_window.py -v

    - name: Verify Standalone Imports
      run: |
        python build_standalone.py --verify-imports

    - name: Dry-run Packaging Build
      run: |
        python build_standalone.py --dry-run

  test-windows:
    name: Build & Verification (Windows Python 3.12)
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Set up FFmpeg
      uses: FedericoCarboni/setup-ffmpeg@v3
      id: setup-ffmpeg
      continue-on-error: true

    - name: Fallback FFmpeg (if setup-ffmpeg failed)
      if: steps.setup-ffmpeg.outcome != 'success'
      shell: pwsh
      run: |
        choco install ffmpeg --no-progress || echo "FFmpeg setup skipped"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Verify Standalone Imports
      run: |
        python build_standalone.py --verify-imports

    - name: Dry-run Packaging Build
      run: |
        python build_standalone.py --dry-run

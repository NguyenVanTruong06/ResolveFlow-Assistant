name: Build & Release Standalone

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  release-windows:
    name: Build & Release Standalone Executable (Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Set up FFmpeg
      uses: FedericoCarboni/setup-ffmpeg@v3
      id: setup-ffmpeg

    - name: Install Dependencies & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Standalone Executable
      run: |
        python build_standalone.py

    - name: Package Standalone into ZIP Archive
      shell: pwsh
      run: |
        Compress-Archive -Path dist/ResolveFlow-Assistant -DestinationPath "ResolveFlow-Assistant-${{ github.ref_name }}-windows-x64.zip" -Force
        Get-ChildItem -Path "ResolveFlow-Assistant-${{ github.ref_name }}-windows-x64.zip"

    - name: Publish GitHub Release with Assets
      uses: softprops/action-gh-release@v2
      with:
        files: ResolveFlow-Assistant-${{ github.ref_name }}-windows-x64.zip
        name: "ResolveFlow Assistant ${{ github.ref_name }}"
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
